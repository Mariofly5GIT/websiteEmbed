<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live players</title>
<style>
  :root {
    /* ---------------------------------------------------------------- *
     * FONT — replace the first entry with your site's typeface if you
     * can license it for this domain. Everything uses one family on
     * purpose; the hierarchy comes from weight and size, not variety.
     * ---------------------------------------------------------------- */
    --face: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;

    /* Monochrome by default so it can't clash with your theme.
       Override the accent with ?accent=ff5500 in the iframe URL. */
    --ink:      #15171B;
    --ink-mid:  rgba(21, 23, 27, .58);
    --ink-faint:rgba(21, 23, 27, .12);
    --paper:    #FFFFFF;
    --accent:   #15171B;
  }
  :root[data-theme="dark"] {
    --ink:      #F2F3F5;
    --ink-mid:  rgba(242, 243, 245, .58);
    --ink-faint:rgba(242, 243, 245, .16);
    --paper:    #15171B;
    --accent:   #F2F3F5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: var(--face);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "kern" 1;
  }

  /* Square corners, hairline rules, no shadow — reads as a list entry,
     not a floating card. */
  .entry {
    max-width: 540px;
    border-top: 1px solid var(--ink-faint);
    border-bottom: 1px solid var(--ink-faint);
    padding: 18px 0 16px;
    display: grid;
    grid-template-columns: 84px 1fr;
    column-gap: 18px;
    row-gap: 14px;
    align-items: start;
  }

  .art {
    grid-row: 1 / span 2;
    width: 84px;
    height: 84px;
    object-fit: cover;
    display: block;
    background: var(--ink-faint);
  }

  .title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -.005em;
    line-height: 1.3;
    margin: 0 0 3px;
  }
  .by {
    font-size: 12.5px;
    color: var(--ink-mid);
    line-height: 1.35;
  }
  .check {
    display: inline-block;
    margin-left: 3px;
    color: var(--accent);
  }

  /* The number is the whole point, so it gets the space and nothing
     competes with it. No label above, no box around it. */
  .figure {
    grid-column: 2;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .count {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -.035em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }
  .caption {
    margin-top: 7px;
    font-size: 12.5px;
    color: var(--ink-mid);
    line-height: 1.4;
  }

  .play {
    align-self: flex-end;
    flex: 0 0 auto;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid var(--ink-faint);
    padding-bottom: 2px;
    transition: border-color .15s;
    white-space: nowrap;
  }
  .play:hover { border-bottom-color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  /* Supporting numbers run as one quiet line, not a grid of cells. */
  .stats {
    grid-column: 2;
    font-size: 12.5px;
    color: var(--ink-mid);
    line-height: 1.6;
    margin: 0;
  }
  .stats b {
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }
  .sep { opacity: .4; margin: 0 7px; }

  .loading { color: transparent; background: var(--ink-faint); border-radius: 2px; }
  .loading.count { width: 4.2em; height: .78em; display: inline-block; }
  .loading.title { width: 9em; height: .9em; display: inline-block; }
  .loading.by    { width: 6em; height: .8em; display: inline-block; }

  .note { font-size: 12.5px; color: var(--ink-mid); line-height: 1.5; padding: 16px 0; }
  .note strong { color: var(--ink); font-weight: 600; display: block; margin-bottom: 3px; }
  .note code {
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 11.5px;
    background: var(--ink-faint);
    padding: 1px 4px;
  }
  [hidden] { display: none !important; }

  @media (max-width: 420px) {
    .entry { grid-template-columns: 60px 1fr; column-gap: 14px; }
    .art { width: 60px; height: 60px; }
    .count { font-size: 36px; }
    .figure { gap: 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="entry" id="entry">
  <img class="art" id="art" alt="" width="84" height="84">
  <div>
    <p class="title" id="title"><span class="loading title"></span></p>
    <div class="by" id="by"><span class="loading by"></span></div>
  </div>
  <div class="figure">
    <div>
      <p class="count" id="count"><span class="loading count"></span></p>
      <div class="caption" id="caption">playing right now</div>
    </div>
    <a class="play" id="play" href="#" target="_blank" rel="noopener">Play&nbsp;→</a>
  </div>
  <p class="stats" id="stats"></p>
</div>

<div class="note" id="note" hidden>
  <strong id="noteTitle"></strong>
  <span id="noteBody"></span>
</div>

<script>
(() => {
  "use strict";

  /* ------------------------------------------------------------------ *
   * Your deployed Cloudflare Worker. This page is hosted separately (on
   * GitHub Pages), so it calls the worker across origins — which is why
   * the worker sends CORS headers.
   * ------------------------------------------------------------------ */
  const API = "https://broad-mode-1cdf.coolportfoliostuff.workers.dev/api";
  const REFRESH_MS = 60000;

  // Settings come from either the path or the query string. The path form
  // exists because some site builders reject iframe URLs containing "?".
  //   /920587237
  //   /920587237/dark
  //   /920587237/dark/ff5500
  const qs  = new URLSearchParams(location.search);
  const seg = location.pathname.split("/").filter(Boolean);
  const THEMES = ["light", "dark", "auto"];

  const pathId     = /^\d+$/.test(seg[0] || "") ? seg[0] : "";
  const pathTheme  = THEMES.includes(seg[1]) ? seg[1] : "";
  const pathAccent = (seg[2] || "").replace(/[^0-9a-fA-F]/g, "");

  const placeId    = pathId || (qs.get("placeId") || "").replace(/\D/g, "");
  const universeId = (qs.get("universeId") || "").replace(/\D/g, "");
  const theme      = pathTheme || qs.get("theme") || "auto";
  const accent     = pathAccent || (qs.get("accent") || "").replace(/[^0-9a-fA-F]/g, "");

  const root = document.documentElement;
  const prefersDark = matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = theme === "auto" ? (prefersDark ? "dark" : "light") : theme;
  if (accent.length === 3 || accent.length === 6) {
    root.style.setProperty("--accent", "#" + accent);
  }

  const $ = id => document.getElementById(id);
  const full    = new Intl.NumberFormat(undefined);
  const compact = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });

  let lastOk = null;
  let timer = null, ticker = null;

  function sinceText() {
    if (!lastOk) return "";
    const s = Math.round((Date.now() - lastOk) / 1000);
    if (s < 45) return "updated just now";
    const m = Math.round(s / 60);
    if (m < 60) return `updated ${m} minute${m > 1 ? "s" : ""} ago`;
    const h = Math.round(m / 60);
    return `updated ${h} hour${h > 1 ? "s" : ""} ago`;
  }

  function ago(iso) {
    if (!iso) return null;
    const secs = (Date.now() - new Date(iso).getTime()) / 1000;
    for (const [unit, size] of [["year",31536000],["month",2592000],["day",86400],["hour",3600]]) {
      if (secs >= size) {
        const n = Math.floor(secs / size);
        return `${n} ${unit}${n > 1 ? "s" : ""} ago`;
      }
    }
    return "today";
  }

  function paintCaption() {
    const bits = ["playing right now"];
    const s = sinceText();
    if (s) bits.push(s);
    $("caption").textContent = bits.join(" · ");
  }

  async function load() {
    if (!placeId && !universeId) {
      return note("No game set", 'Add the game ID to the URL, like <code>/920587237</code>.');
    }
    const url = new URL(API);
    url.searchParams.set(universeId ? "universeId" : "placeId", universeId || placeId);

    try {
      const res = await fetch(url, { headers: { Accept: "application/json" } });
      const data = await res.json().catch(() => null);
      if (!res.ok) return note("Couldn't load this game", (data && data.error) || `Returned ${res.status}.`);
      render(data);
      lastOk = Date.now();
      paintCaption();
    } catch (err) {
      if (!lastOk) {
        note("Couldn't reach the stats service",
             "Check that <code>API</code> at the top of this file points at your " +
             "worker, and that the worker allows this origin. This will keep retrying.");
      } else {
        paintCaption();   // keep the last good numbers on screen
      }
    }
  }

  function render(d) {
    document.querySelectorAll(".loading").forEach(el => el.remove());

    $("title").textContent = d.name || "Untitled";
    $("by").innerHTML = "by " + esc(d.creator && d.creator.name || "Unknown") +
      (d.creator && d.creator.verified ? '<span class="check" title="Verified">✓</span>' : "");
    document.title = `${d.name} — ${full.format(d.playing)} playing`;

    if (d.iconUrl || d.thumbnailUrl) {
      $("art").src = d.iconUrl || d.thumbnailUrl;
      $("art").alt = `${d.name} icon`;
    }

    $("count").textContent = full.format(d.playing);
    $("play").href = d.playUrl;

    const parts = [];
    if (d.visits)    parts.push(`<b>${compact.format(d.visits)}</b> visits`);
    if (d.favorites) parts.push(`<b>${compact.format(d.favorites)}</b> favourites`);
    if (d.ratingPercent !== null && d.ratingPercent !== undefined)
      parts.push(`<b>${d.ratingPercent}%</b> rating`);
    if (d.maxPlayers) parts.push(`<b>${d.maxPlayers}</b> per server`);
    if (d.updated)    parts.push(`last updated ${ago(d.updated)}`);
    $("stats").innerHTML = parts.join('<span class="sep">·</span>');
  }

  function note(title, body) {
    $("entry").hidden = true;
    $("noteTitle").textContent = title;
    $("noteBody").innerHTML = body;
    $("note").hidden = false;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  }

  function start() {
    stop();
    timer  = setInterval(load, REFRESH_MS);
    ticker = setInterval(paintCaption, 20000);
  }
  function stop() {
    if (timer) clearInterval(timer);
    if (ticker) clearInterval(ticker);
    timer = ticker = null;
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stop();
    else { load(); start(); }
  });

  load();
  start();
})();
</script>
</body>
</html>
